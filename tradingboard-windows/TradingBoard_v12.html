function generateReportText(proj, trades, s, bwHour, bwDay, bwSession){
  if(!trades.length) return 'داده‌ای برای تولید گزارش تحلیلی موجود نیست.';
  let parts = [];
  parts.push(`این بک‌تست شامل ${s.n} معامله است.`);
  parts.push(`مجموع عملکرد برابر ${fmtR(s.totalR)} بوده و Expectancy برابر ${fmtR(s.expectancy)} به ازای هر معامله است.`);
  parts.push(`نرخ برد (Win Rate) برابر ${fmtPct(s.winRate)} و Profit Factor برابر ${isFinite(s.profitFactor)?s.profitFactor.toFixed(2):'نامحدود'} بوده است.`);
  if(bwHour.best) parts.push(`بهترین عملکرد ساعتی مربوط به ساعت ${bwHour.best[0]} با Expectancy ${fmtR(bwHour.best[1].expectancy)} بوده است.`);
  else parts.push('داده کافی برای تعیین بهترین ساعت معاملاتی وجود ندارد.');
  if(bwDay.best) parts.push(`بهترین روز هفته از نظر عملکرد، ${bwDay.best[0]} بوده است.`);
  if(bwSession.best) parts.push(`بهترین Session، ${bwSession.best[0]} با Expectancy ${fmtR(bwSession.best[1].expectancy)} بوده است.`);
  parts.push(`بیشترین افت سرمایه (Max Drawdown) در طول این بک‌تست برابر ${fmtR(-s.maxDD)} بوده است.`);
  if(s.maxLossStreak>=4) parts.push(`رکورد باخت متوالی به ${s.maxLossStreak} معامله رسیده که نیازمند بررسی مدیریت ریسک در دوره‌های افت است.`);
  return parts.join(' ');
}

/* ---- Backup / Restore ---- */
async function buildBackupJson(backupSerial=null, backupCode=null){
  const [projects, trades, ideas, experiments, ruleVersions, audioRecs, screenshotRecs] = await Promise.all([
    dbGetAll('projects'), dbGetAll('trades'), dbGetAll('ideas'), dbGetAll('experiments'), dbGetAll('ruleVersions'), dbGetAll('audio'), dbGetAll('screenshots')
  ]);
  const audioB64 = await Promise.all(audioRecs.map(async r=> ({...r, blob: undefined, dataUrl: await blobToBase64(r.blob)})));
  const shotB64 = await Promise.all(screenshotRecs.map(async r=> ({...r, blob: undefined, dataUrl: await blobToBase64(r.blob)})));
  return {
    appVersion: window.APP_VERSION, exportedAt: nowISO(),
    backupSerial: backupSerial ?? null,
    backupCode: backupCode ?? null,
    projects, trades, ideas, experiments, ruleVersions,
    appSettings: {appName: AppState.appName, affirmations: AppState.affirmations, minSampleSize: AppState.minSampleSize},
    audio: audioB64, screenshots: shotB64,
  };
}

const BACKUP_SERIAL_STORAGE_KEY = 'tradingboard_backup_serials_v1';

function backupDateKey(date=new Date()){
  const y=date.getFullYear();
  const m=String(date.getMonth()+1).padStart(2,'0');
  const d=String(date.getDate()).padStart(2,'0');
  return `${y}-${m}-${d}`;
}
function backupDateLabel(date=new Date()){
  return backupDateKey(date);
}
function backupAppBaseName(){
  return (AppState.appName||'backtest-lab')
    .replace(/[^\p{L}\p{N}\-_ ]/gu,'')
    .trim().replace(/\s+/g,'-') || 'backtest-lab';
}
function readBackupSerials(){
  try{return JSON.parse(localStorage.getItem(BACKUP_SERIAL_STORAGE_KEY)||'{}')||{};}catch(e){return {};}
}
function getNextBackupSerial(){
  const map=readBackupSerials();
  const key=backupDateKey();
  return Math.max(1, Number(map[key]||0)+1);
}
function commitBackupSerial(serial){
  try{
    const map=readBackupSerials();
    const key=backupDateKey();
    map[key]=Math.max(Number(map[key]||0), Number(serial)||0);
    localStorage.setItem(BACKUP_SERIAL_STORAGE_KEY, JSON.stringify(map));
  }catch(e){ console.warn('Backup serial could not be persisted',e); }
}
function backupFileName(serial){
  const n=String(serial||1).padStart(2,'0');
  return `${backupAppBaseName()}-backup-${backupDateLabel()}-${n}.json`;
}
function backupCode(serial){
  return `${backupDateKey().replace(/-/g,'')}-${String(serial||1).padStart(3,'0')}`;
}

async function saveBackupToChosenLocation(){
  let serial=getNextBackupSerial();
  try{
    toast(`در حال آماده‌سازی نسخه پشتیبان شماره ${serial}...`, 'info', {duration:2500});
    const code=backupCode(serial);
    const backup = await buildBackupJson(serial, code);
    const json = JSON.stringify(backup);
    let saved=false;
    const filename = backupFileName(serial);
    if(typeof window.showSaveFilePicker === 'function'){
      const handle = await window.showSaveFilePicker({
        suggestedName: filename,
        types: [{description:'فایل پشتیبان Trading Board', accept:{'application/json':['.json']}}]
      });
      const writable = await handle.createWritable();
      await writable.write(json);
      await writable.close();
      saved=true;
    }else{
      download(filename, json, 'application/json');
      saved=true;
      toast('مرورگر شما انتخاب محل ذخیره را پشتیبانی نمی‌کند؛ فایل در محل دانلود مرورگر ذخیره شد', 'info', {duration:4500});
    }
    if(saved){
      commitBackupSerial(serial);
      toast(`نسخه پشتیبان شماره ${serial} ذخیره شد · کد: ${code}`, 'success', {duration:3500});
    }
  }catch(err){
    if(err && (err.name==='AbortError' || err.name==='NotAllowedError')){
      toast('ذخیره نسخه پشتیبان لغو شد؛ شماره این نسخه برای دفعه بعد محفوظ نماند', 'info');
      return;
    }
    console.error(err);
    toast('ذخیره نسخه پشتیبان انجام نشد', 'error');
  }
}

async function exportBackup(){
  // Export Backup از تنظیمات هم دقیقاً مثل «پشتیبانی سریع» با انتخاب محل ذخیره کار می‌کند.
  await saveBackupToChosenLocation();
}
let pendingRestoreData = null;
function openQuickRestore(){
  const input = document.getElementById('quick-restore-file-input');
  if(!input) return;
  input.value = '';
  input.click();
}
function handleRestoreFile(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      pendingRestoreData = data;
      const preview = document.getElementById('restore-preview');
      if(preview){
        preview.innerHTML = `
          <div class="warn-box" style="background:var(--accent-dim); color:var(--accent)">
            پروژه‌ها: ${data.projects?.length||0} · معاملات: ${data.trades?.length||0} · ایده‌ها: ${data.ideas?.length||0}
          </div>
          <div class="row" style="gap:6px; margin-top:8px">
            <button class="btn btn-sm btn-primary" onclick="doRestore('replace')">جایگزینی کامل</button>
            <button class="btn btn-sm" onclick="doRestore('merge')">Merge با داده فعلی</button>
          </div>
        `;
      }else{
        const countText = `پروژه‌ها: ${data.projects?.length||0} · معاملات: ${data.trades?.length||0} · ایده‌ها: ${data.ideas?.length||0}`;
        const replace = confirm(`نسخه پشتیبان انتخاب شد.\n\n${countText}\n\nبرای «جایگزینی کامل» OK را بزنید.\nبرای لغو، Cancel را بزنید.`);
        if(replace){
          doRestore('replace');
        }else if(confirm('می‌خواهید اطلاعات نسخه پشتیبان با داده‌های فعلی Merge شود؟')){
          doRestore('merge');
        }else{
          pendingRestoreData = null;
          toast('بازیابی لغو شد', 'info');
        }
      }
    }catch(err){
      pendingRestoreData = null;
      toast('فایل پشتیبان معتبر نیست', 'error');
    }
  };
  reader.readAsText(file);
}
async function doRestore(mode){
  if(!pendingRestoreData) return;
  if(!confirm(mode==='replace' ? 'تمام داده‌های فعلی جایگزین خواهند شد. ادامه می‌دهید؟' : 'داده‌های جدید با داده‌های فعلی ادغام می‌شوند. ادامه می‌دهید؟')) return;
  const data = pendingRestoreData;
  if(mode==='replace'){
    await Promise.all(['projects','trades','ideas','audio','screenshots','experiments','ruleVersions'].map(s=>dbClear(s)));
    AppState.projects=[]; AppState.trades=[]; AppState.ideas=[]; AppState.experiments=[]; AppState.ruleVersions=[];
  }
  for(const p of (data.projects||[])){ await dbPut('projects', p); if(!AppState.projects.find(x=>x.id===p.id)) AppState.projects.push(p); }
  for(const t of (data.trades||[])){ await dbPut('trades', t); if(!AppState.trades.find(x=>x.id===t.id)) AppState.trades.push(t); }
  for(const i of (data.ideas||[])){ await dbPut('ideas', i); if(!AppState.ideas.find(x=>x.id===i.id)) AppState.ideas.push(i); }
  for(const e of (data.experiments||[])){ await dbPut('experiments', e); if(!AppState.experiments.find(x=>x.id===e.id)) AppState.experiments.push(e); }
  for(const rv of (data.ruleVersions||[])){ await dbPut('ruleVersions', rv); if(!AppState.ruleVersions.find(x=>x.id===rv.id)) AppState.ruleVersions.push(rv); }
  for(const a of (data.audio||[])){ if(a.dataUrl){ await dbPut('audio', {...a, blob: base64ToBlob(a.dataUrl), dataUrl: undefined}); } }
  for(const s of (data.screenshots||[])){ if(s.dataUrl){ await dbPut('screenshots', {...s, blob: base64ToBlob(s.dataUrl), dataUrl: undefined}); } }
  if(data.appSettings){
    if(data.appSettings.appName) { AppState.appName = data.appSettings.appName; localStorage.setItem('btlab_app_name', AppState.appName); }
    if(Array.isArray(data.appSettings.affirmations)) saveAffirmations(data.appSettings.affirmations);
    if(Number.isFinite(Number(data.appSettings.minSampleSize))){ AppState.minSampleSize = Number(data.appSettings.minSampleSize); localStorage.setItem('btlab_min_sample', AppState.minSampleSize); }
    applyAppBranding();
  }
  pendingRestoreData = null;
  toast('بازیابی داده‌ها با موفقیت انجام شد', 'success');
  if(!AppState.activeProjectId && AppState.projects.length) AppState.activeProjectId = AppState.projects[0].id;
  renderProjectSelect();
  router();
}

    applySidebarState(localStorage.getItem('btlab_sidebar_collapsed') !== '0');

  }
}
initApp();
