<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>آزمایشگاه بک‌تست | Backtest Lab</title>
<style>
:root{
  --bg:#f4f5f7; --bg-card:#ffffff; --bg-alt:#eef0f3; --border:#e1e4e9;
  --text:#1b1e24; --text-dim:#6b7280; --text-faint:#9aa1ab;
  --accent:#3b6ef6; --accent-dim:#e8effe;
  --win:#1a9e6b; --win-bg:#e5f8f1; --loss:#e0453f; --loss-bg:#fdecec;
  --be:#c98a1d; --be-bg:#fdf3e2; --partial:#7b5cf0; --partial-bg:#efeafd;
  --shadow:0 1px 3px rgba(20,20,30,.06), 0 1px 2px rgba(20,20,30,.04);
  --radius:10px; --radius-sm:6px;
  --font: 'Vazirmatn', 'IRANSans', Tahoma, 'Segoe UI', sans-serif;
}
html[data-theme="dark"]{
  --bg:#12141a; --bg-card:#1b1e26; --bg-alt:#20232c; --border:#2b2f3a;
  --text:#e8eaef; --text-dim:#a2a8b5; --text-faint:#6b7280;
  --accent:#5b8bff; --accent-dim:#1c2740;
  --win:#3fcc94; --win-bg:#123528; --loss:#ff6b64; --loss-bg:#3a1a1a;
  --be:#e3ab4c; --be-bg:#3a2c10; --partial:#a48bff; --partial-bg:#251c40;
  --shadow:0 1px 3px rgba(0,0,0,.4), 0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box; margin:0; padding:0;}
body{font-family:var(--font); background:var(--bg); color:var(--text); font-size:14px; line-height:1.6; overflow-x:hidden;}
button, input, select, textarea{font-family:inherit; font-size:inherit; color:inherit;}
a{color:inherit; text-decoration:none;}
::-webkit-scrollbar{width:9px; height:9px;}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px;}

#app{min-height:100vh;}

/* Clean floating sidebar */
#sidebar{
  width:248px;
  flex-shrink:0;
  background:color-mix(in srgb, var(--bg-card) 94%, transparent);
  border:1px solid var(--border);
  display:flex;
  flex-direction:column;
  position:fixed;
  right:16px;
  top:16px;
  bottom:16px;
  height:auto;
  min-height:0;
  z-index:100;
  border-radius:16px;
  overflow:visible;
  box-shadow:0 14px 38px rgba(20,25,40,.12), 0 3px 12px rgba(20,25,40,.06);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  transition:width .22s ease, box-shadow .22s ease, background .22s ease;
}
#sidebar.collapsed{width:64px;}
.sidebar-top{min-height:58px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;border-bottom:1px solid var(--border);}
.brand{min-width:0;padding:5px 2px;font-weight:800;font-size:14px;display:flex;align-items:center;overflow:hidden;}
.brand .dot{display:none;}
.brand-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#sidebar-toggle{width:36px;height:36px;flex:0 0 36px;display:grid;place-items:center;border:0;border-radius:10px;background:transparent;color:var(--text-dim);cursor:pointer;font-size:20px;line-height:1;transition:background .16s,color .16s,transform .16s;}
#sidebar-toggle:hover{background:var(--bg-alt);color:var(--text);}
#nav-list{list-style:none;padding:8px 8px 6px;flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;}
#nav-list::-webkit-scrollbar{width:0;height:0;}
#nav-list li{margin-bottom:2px;}
#nav-list a{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:10px;color:var(--text-dim);font-weight:700;font-size:12.5px;transition:background .14s,color .14s;min-height:38px;}
#nav-list a:hover{background:var(--bg-alt);color:var(--text);}
#nav-list a.active{background:var(--accent-dim);color:var(--accent);box-shadow:none;}
#nav-list .icon{width:24px;height:24px;display:grid;place-items:center;flex:0 0 24px;}
#nav-list .icon svg{width:19px;height:19px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.nav-label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sidebar-foot{padding:7px 8px 9px;border-top:1px solid var(--border);display:flex;gap:8px;}
.sidebar-foot .theme-btn{width:100%;justify-content:center;min-height:36px;padding:6px 9px;}
.project-select-wrap{padding:8px 10px 3px;}
.project-select-wrap label{font-size:9px;color:var(--text-faint);display:block;margin-bottom:3px;}
#sidebar.collapsed .sidebar-top{justify-content:center;padding:9px 7px;}
#sidebar.collapsed .brand,
#sidebar.collapsed .project-select-wrap,
#sidebar.collapsed .nav-label,
#sidebar.collapsed .theme-label{display:none;}
#sidebar.collapsed #sidebar-toggle{position:static;}
#sidebar.collapsed #nav-list{padding:8px 6px 6px;}
#sidebar.collapsed #nav-list a{justify-content:center;padding:6px 0;min-height:39px;}
#sidebar.collapsed #nav-list .icon{width:38px;height:38px;flex-basis:38px;border-radius:10px;}
#sidebar.collapsed #nav-list a:hover .icon{background:var(--bg-alt);}
#sidebar.collapsed #nav-list a.active .icon{background:var(--accent-dim);}

/* Main */
#content{min-width:0;max-width:100%;padding:22px 26px 60px 26px;padding-right:100px;transition:padding-right .24s ease;}
body.sidebar-expanded #content{padding-right:292px;}
.page-title{font-size:20px; font-weight:800; margin-bottom:4px;}
.page-sub{color:var(--text-dim); font-size:13px; margin-bottom:20px;}
.topbar{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:16px; flex-wrap:wrap; gap:10px;}

/* Cards & grid */
.grid{display:grid; gap:14px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:640px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}}

.card{background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow);}
.stat-card{background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; box-shadow:var(--shadow);}
.stat-card .label{font-size:12px; color:var(--text-dim); margin-bottom:6px; font-weight:600;}
.stat-card .value{font-size:22px; font-weight:800;}
.stat-card .sub{font-size:11px; color:var(--text-faint); margin-top:3px;}
.pos{color:var(--win);} .neg{color:var(--loss);} .neu{color:var(--be);}

.section-title{font-size:15px; font-weight:800; margin:26px 0 12px;}
.section-title:first-child{margin-top:0;}

/* Buttons */
.btn{display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--bg-card); cursor:pointer; font-weight:700; font-size:13px; transition:.15s;}
.btn:hover{background:var(--bg-alt);}
.btn-primary{background:var(--accent); border-color:var(--accent); color:#fff;}
.btn-primary:hover{filter:brightness(1.08);}
.btn-danger{background:var(--loss); border-color:var(--loss); color:#fff;}
.btn-ghost{background:transparent; border-color:transparent;}
.btn-sm{padding:5px 10px; font-size:12px;}
.btn:disabled{opacity:.5; cursor:not-allowed;}

/* Forms */
.field{margin-bottom:12px;}
.field label{display:block; font-size:12.5px; font-weight:700; margin-bottom:5px; color:var(--text-dim);}
.field input[type=text], .field input[type=number], .field input[type=date], .field input[type=time],
.field select, .field textarea{width:100%; padding:9px 10px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--bg); color:var(--text);}
.field textarea{resize:vertical; min-height:60px;}
.field .hint{font-size:11px; color:var(--text-faint); margin-top:3px;}
.row{display:flex; gap:10px; flex-wrap:wrap;}
.row > .field{flex:1; min-width:140px;}
.checkline{display:flex; align-items:center; gap:7px; padding:6px 0; font-size:13px;}
.checkline input{width:16px; height:16px;}
.pill{display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:20px; font-size:11.5px; font-weight:700;}
.pill-win{background:var(--win-bg); color:var(--win);}
.pill-loss{background:var(--loss-bg); color:var(--loss);}
.pill-be{background:var(--be-bg); color:var(--be);}
.pill-partial{background:var(--partial-bg); color:var(--partial);}
.pill-gray{background:var(--bg-alt); color:var(--text-dim);}
.tag{display:inline-block; background:var(--accent-dim); color:var(--accent); padding:2px 8px; border-radius:12px; font-size:11px; font-weight:700; margin:2px 3px 0 0;}

/* Table */
table{width:100%; border-collapse:collapse; font-size:13px;}
th{text-align:right; padding:9px 10px; background:var(--bg-alt); color:var(--text-dim); font-weight:700; font-size:12px; position:sticky; top:0;}
td{padding:8px 10px; border-bottom:1px solid var(--border);}
tr:hover td{background:var(--bg-alt);}
.table-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius); background:var(--bg-card);}
.table-scroll{max-height:560px; overflow-y:auto;}

/* Trades page: keep the page itself fixed; only the trades table scrolls. */
#content.trades-page{height:100vh;box-sizing:border-box;overflow:hidden;display:flex;flex-direction:column;padding-bottom:22px;}
#content.trades-page #trade-list-container{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;}
#content.trades-page #trade-list-container > .table-wrap{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;}
#content.trades-page #trade-list-container > .table-wrap > .table-scroll{flex:1 1 auto;min-height:0;max-height:none;height:auto;overflow-y:auto;}

/* Modal */
.modal-overlay{position:fixed; inset:0; background:rgba(10,12,18,.55); display:flex; align-items:flex-start; justify-content:center; padding:40px 16px; z-index:200; overflow-y:auto;}
.modal{background:var(--bg-card); border-radius:var(--radius); width:100%; max-width:640px; box-shadow:0 20px 60px rgba(0,0,0,.3); border:1px solid var(--border);}
.modal.modal-lg{max-width:880px;}
.modal-head{display:flex; justify-content:space-between; align-items:center; padding:16px 18px; border-bottom:1px solid var(--border);}
.modal-head h3{font-size:16px; font-weight:800;}
.modal-body{padding:18px; max-height:70vh; overflow-y:auto;}
.modal-foot{padding:14px 18px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:8px;}
.close-x{cursor:pointer; font-size:18px; color:var(--text-dim); background:none; border:none; padding:4px 8px;}

/* Toast */
#toast-container{position:fixed; bottom:20px; left:20px; z-index:500; display:flex; flex-direction:column; gap:8px;}
.toast{background:var(--bg-card); border:1px solid var(--border); box-shadow:var(--shadow); padding:10px 16px; border-radius:var(--radius-sm); font-size:13px; display:flex; align-items:center; gap:10px; animation:slideup .2s ease;}
@keyframes slideup{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
.toast.success{border-right:3px solid var(--win);}
.toast.error{border-right:3px solid var(--loss);}
.toast.info{border-right:3px solid var(--accent);}

/* FAB */
#fab-idea{position:fixed;bottom:24px;left:24px;z-index:100;width:44px;height:44px;padding:0;border:1px solid var(--accent);border-radius:50%;background:var(--accent);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(59,110,246,.30);font-size:13px;font-weight:800;line-height:1;transition:transform .15s ease,box-shadow .15s ease,filter .15s ease;}
#fab-idea:hover{transform:translateY(-1px);filter:brightness(1.05);box-shadow:0 10px 26px rgba(59,110,246,.38);}
#fab-idea:active{transform:translateY(0) scale(.96);}
#fab-idea .idea-lamp{font-size:18px;color:#ffd83d;filter:drop-shadow(0 0 3px rgba(255,216,61,.65));line-height:1;}

/* misc */
.empty-state{text-align:center; padding:50px 20px; color:var(--text-faint);}
.empty-state .big{font-size:32px; margin-bottom:8px;}
.badge-count{background:var(--accent-dim); color:var(--accent); padding:1px 7px; border-radius:10px; font-size:11px; font-weight:800;}
.divider{height:1px; background:var(--border); margin:14px 0;}
.flex-between{display:flex; justify-content:space-between; align-items:center;}
.muted{color:var(--text-dim);}
.small{font-size:12px;}
.center{text-align:center;}
.saving-indicator{font-size:11.5px; color:var(--text-faint); display:flex; align-items:center; gap:5px;}
.filters-bar{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; background:var(--bg-card); padding:12px; border-radius:var(--radius); border:1px solid var(--border);}
.filters-bar select, .filters-bar input{padding:6px 9px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--bg); font-size:12.5px;}
.hour-filter-wrap{position:relative; display:inline-block;}
.hour-filter-btn{min-width:145px; justify-content:space-between;}
.hour-filter-panel{position:absolute; top:calc(100% + 6px); right:0; z-index:80; width:330px; max-height:360px; overflow-y:auto; background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); box-shadow:0 12px 35px rgba(0,0,0,.25); padding:10px;}
.hour-filter-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:5px;}
.hour-option{display:flex; align-items:center; gap:5px; padding:6px 7px; border:1px solid var(--border); border-radius:6px; cursor:pointer; font-size:11.5px; background:var(--bg);}
.hour-option:hover{background:var(--bg-alt);}
.hour-option input{width:14px; height:14px; margin:0;}
.hour-filter-actions{display:flex; gap:6px; margin-bottom:8px; position:sticky; top:-10px; padding:0 0 8px; background:var(--bg-card);}

.chart-box{background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:14px; box-shadow:var(--shadow);}
.chart-box h4{font-size:13.5px; font-weight:800; margin-bottom:10px;}
.idea-card{background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:14px; box-shadow:var(--shadow); margin-bottom:12px;}
.warn-box{background:var(--be-bg); color:var(--be); padding:8px 12px; border-radius:var(--radius-sm); font-size:12px; font-weight:700; margin:8px 0;}
.kbd{background:var(--bg-alt); border:1px solid var(--border); border-radius:4px; padding:1px 6px; font-size:11px; font-family:monospace;}

.weekday-filter-wrap{position:relative;display:inline-block;}
.weekday-filter-btn{min-width:105px;}
.weekday-filter-panel{position:absolute;z-index:1000;top:calc(100% + 6px);right:0;width:260px;padding:10px;background:var(--bg-card);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);}
.weekday-filter-panel[hidden]{display:none;}
.weekday-filter-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:9px;}
.weekday-option{display:flex;align-items:center;gap:7px;padding:7px 8px;border:1px solid var(--border);border-radius:7px;cursor:pointer;font-size:11.5px;background:var(--bg);}
.weekday-option input{accent-color:var(--accent);}
/* ========================= PRO EQUITY CHART ========================= */
.pro-equity-page{display:flex;flex-direction:column;gap:14px;}
.pro-equity-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;}
.pro-equity-title{font-size:19px;font-weight:900;}
.pro-equity-sub{font-size:11px;color:var(--text-faint);margin-top:4px;}
.pro-equity-actions{display:flex;gap:7px;flex-wrap:wrap;}
.pro-equity-toolbar{display:flex;gap:7px;flex-wrap:wrap;}
.pro-equity-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--border);border-radius:9px;background:var(--bg-card);font-size:11px;font-weight:800;}
.pro-equity-chart-card{background:var(--bg-card);border:1px solid var(--border);border-radius:15px;box-shadow:var(--shadow);overflow:hidden;}
.pro-equity-chart-container{position:relative;}
.pro-equity-modebar{position:absolute;top:10px;right:12px;z-index:5;display:flex;gap:4px;padding:4px;border:1px solid var(--border);border-radius:9px;background:color-mix(in srgb,var(--bg-card) 92%,transparent);backdrop-filter:blur(5px);}
.pro-equity-modebar .btn{min-height:28px;padding:4px 8px;font-size:10px;}
.pro-equity-modebar .btn.active{background:var(--accent);color:var(--bg-card);border-color:var(--accent);}
@media(max-width:600px){.pro-equity-modebar{position:static;margin:8px 8px 0;justify-content:flex-start;overflow:auto;}.pro-equity-chart-wrap{padding-top:4px;}}
.pro-equity-chart-wrap{position:relative;padding:10px 12px 4px;}
.pro-equity-svg{display:block;width:100%;height:auto;min-height:330px;cursor:crosshair;}
.pro-equity-cross{pointer-events:none;opacity:0;}
.pro-equity-hover{fill:transparent;cursor:crosshair;}
.pro-equity-tooltip{position:absolute;z-index:20;min-width:210px;max-width:270px;padding:10px 11px;border:1px solid var(--border);border-radius:10px;background:var(--bg-card);box-shadow:0 12px 28px rgba(0,0,0,.16);pointer-events:none;font-size:11px;display:none;}
.pro-equity-tooltip .pt-title{font-weight:900;font-size:12px;margin-bottom:6px;}
.pro-equity-tooltip .pt-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px;}
.pro-equity-tooltip .pt-k{color:var(--text-faint);font-size:10px;}
.pro-equity-tooltip .pt-v{font-weight:900;}
.pro-equity-summary{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px;}
.pro-equity-stat{padding:10px 11px;border:1px solid var(--border);border-radius:10px;background:var(--bg-alt);}
.pro-equity-stat .k{font-size:10px;color:var(--text-faint);font-weight:800;}
.pro-equity-stat .v{font-size:14px;font-weight:900;margin-top:3px;}
.pro-equity-table-wrap{overflow:auto;max-height:430px;border-top:1px solid var(--border);}
.pro-equity-table{width:100%;border-collapse:collapse;font-size:11px;}
.pro-equity-table th,.pro-equity-table td{padding:8px 9px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap;}
.pro-equity-table th{position:sticky;top:0;background:var(--bg-card);font-size:10px;color:var(--text-faint);z-index:2;}
.pro-equity-table tr:hover td{background:var(--bg-alt);}
@media(max-width:900px){.pro-equity-summary{grid-template-columns:repeat(3,minmax(0,1fr));}.pro-equity-svg{min-height:290px;}}
@media(max-width:600px){.pro-equity-summary{grid-template-columns:repeat(2,minmax(0,1fr));}.pro-equity-chart-wrap{padding:5px;}.pro-equity-tooltip{min-width:185px;font-size:10px;}}

/* ========================= DASHBOARD PRO UI ========================= */
.dashboard-pro{display:flex;flex-direction:column;gap:16px;}
.dashboard-hero{position:relative;overflow:hidden;padding:20px 22px;border:1px solid var(--border);border-radius:16px;background:linear-gradient(135deg,var(--bg-card),var(--bg-alt));box-shadow:var(--shadow);}
.dashboard-hero:after{content:"";position:absolute;left:-40px;bottom:-70px;width:220px;height:220px;border-radius:50%;background:var(--accent-dim);opacity:.45;pointer-events:none;}
.dashboard-hero-main{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;}
.dashboard-kicker{font-size:11px;color:var(--accent);font-weight:800;letter-spacing:.2px;margin-bottom:4px;}
.dashboard-hero-title{font-size:21px;font-weight:900;line-height:1.45;margin-bottom:4px;}
.dashboard-hero-sub{font-size:12px;color:var(--text-dim);display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.dashboard-hero-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px;}
.dashboard-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--border);border-radius:999px;background:var(--bg-card);font-size:11.5px;color:var(--text-dim);font-weight:700;}
.dashboard-actions{display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:1;}
.dashboard-actions .btn{min-height:38px;}
.dashboard-kpis{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:10px;}
.dashboard-kpi{background:var(--bg-card);border:1px solid var(--border);border-radius:13px;padding:11px 10px;box-shadow:var(--shadow);min-width:0;position:relative;overflow:hidden;}
.dashboard-kpi:after{content:"";position:absolute;inset:auto -18px -22px auto;width:58px;height:58px;border-radius:50%;background:var(--accent-dim);opacity:.26;pointer-events:none;}
.dashboard-kpi-top{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:7px;}
.dashboard-kpi-icon{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--bg-alt);font-size:14px;position:relative;z-index:1;}
.dashboard-kpi-label{font-size:10.5px;color:var(--text-dim);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dashboard-kpi-value{font-size:20px;font-weight:900;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.2px;}
.dashboard-kpi-sub{font-size:9.5px;color:var(--text-faint);margin-top:3px;min-height:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dashboard-kpi-progress{height:3px;border-radius:99px;background:var(--bg-alt);overflow:hidden;margin-top:8px;}

<body>
<div id="app">
  <aside id="sidebar" class="collapsed">

<div id="toast-container"></div>
<input type="file" id="quick-restore-file-input" accept=".json,application/json" style="display:none" onchange="handleRestoreFile(event)">
<script>
/* ========================= DB LAYER ========================= */
const DB_NAME = 'BacktestLabDB';
const DB_VERSION = 1;
let dbInstance = null;

function dbOpen(){
  return new Promise((resolve, reject)=>{
    if(dbInstance){ resolve(dbInstance); return; }
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e)=>{
      const db = e.target.result;
      if(!db.objectStoreNames.contains('projects')) db.createObjectStore('projects', {keyPath:'id'});
      if(!db.objectStoreNames.contains('trades')){
        const s = db.createObjectStore('trades', {keyPath:'id'});
        s.createIndex('projectId','projectId',{unique:false});
      }
      if(!db.objectStoreNames.contains('ideas')){
        const s = db.createObjectStore('ideas', {keyPath:'id'});
        s.createIndex('projectId','projectId',{unique:false});
        s.createIndex('tradeId','tradeId',{unique:false});
      }
      if(!db.objectStoreNames.contains('audio')) db.createObjectStore('audio', {keyPath:'id'});
      if(!db.objectStoreNames.contains('screenshots')) db.createObjectStore('screenshots', {keyPath:'id'});
      if(!db.objectStoreNames.contains('settings')) db.createObjectStore('settings', {keyPath:'key'});
      if(!db.objectStoreNames.contains('experiments')){
        const s = db.createObjectStore('experiments', {keyPath:'id'});
        s.createIndex('projectId','projectId',{unique:false});
      }
      if(!db.objectStoreNames.contains('ruleVersions')){
        const s = db.createObjectStore('ruleVersions', {keyPath:'id'});
        s.createIndex('projectId','projectId',{unique:false});
      }
    };
    req.onsuccess = (e)=>{ dbInstance = e.target.result; resolve(dbInstance); };
    req.onerror = (e)=> reject(e.target.error);
  });
}

function dbTx(storeName, mode){
  return dbOpen().then(db => db.transaction(storeName, mode).objectStore(storeName));
}

async function dbGetAll(storeName){
  const store = await dbTx(storeName, 'readonly');
  return new Promise((resolve,reject)=>{
    const req = store.getAll();
    req.onsuccess = ()=> resolve(req.result || []);
    req.onerror = ()=> reject(req.error);
  });
}
async function dbGet(storeName, id){
  const store = await dbTx(storeName, 'readonly');
  return new Promise((resolve,reject)=>{
    const req = store.get(id);
    req.onsuccess = ()=> resolve(req.result || null);
    req.onerror = ()=> reject(req.error);
  });
}
async function dbPut(storeName, obj){
  const store = await dbTx(storeName, 'readwrite');
  return new Promise((resolve,reject)=>{
    const req = store.put(obj);
    req.onsuccess = ()=> resolve(obj);
    req.onerror = ()=> reject(req.error);
  });
}
async function dbDelete(storeName, id){
  const store = await dbTx(storeName, 'readwrite');
  return new Promise((resolve,reject)=>{
    const req = store.delete(id);
    req.onsuccess = ()=> resolve(true);
    req.onerror = ()=> reject(req.error);
  });
}
async function dbClear(storeName){
  const store = await dbTx(storeName, 'readwrite');
  return new Promise((resolve,reject)=>{
    const req = store.clear();
    req.onsuccess = ()=> resolve(true);
    req.onerror = ()=> reject(req.error);
  });
}

/* ========================= UTILS ========================= */
function uid(prefix){ return (prefix||'id') + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8); }
function nowISO(){ return new Date().toISOString(); }
function fmtNum(n, digits){ if(n===null||n===undefined||isNaN(n)) return '—'; digits = digits===undefined?2:digits; return Number(n).toLocaleString('fa-IR',{minimumFractionDigits:0, maximumFractionDigits:digits}); }
function fmtR(n){ if(n===null||n===undefined||isNaN(n)) return '—'; const s = n>=0? '+' : ''; return s + n.toFixed(2) + 'R'; }
function fmtPct(n){ if(n===null||n===undefined||isNaN(n)) return '—'; return (n*100).toFixed(1) + '٪'; }
function fmtMoney(n, unit){ if(n===null||n===undefined||isNaN(n)) return '—'; const s = n>=0?'+':''; return s + Number(n).toLocaleString('fa-IR',{maximumFractionDigits:2}) + ' ' + (unit||''); }
function esc(str){ if(str===null||str===undefined) return ''; return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function weekdayFa(dateStr){
  if(!dateStr) return '';
  const d = new Date(dateStr);
  const days = ['یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه','شنبه'];
  return days[d.getDay()];
}
function jalaliDate(dateStr){
  // Lightweight Gregorian->Jalali for display purposes
  if(!dateStr) return '';
  try{
    const d = new Date(dateStr);
    return new Intl.DateTimeFormat('fa-IR-u-ca-persian',{year:'numeric',month:'2-digit',day:'2-digit'}).format(d);
  }catch(e){ return dateStr; }
}
function debounce(fn, ms){ let t; return function(...a){ clearTimeout(t); t=setTimeout(()=>fn.apply(this,a), ms); }; }
function download(filename, content, mime){
  const blob = new Blob([content], {type: mime||'application/octet-stream'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 3000);
}
function blobToBase64(blob){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=> resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(blob);
  });
}
function base64ToBlob(dataUrl){
  const [meta, b64] = dataUrl.split(',');
  const mimeMatch = meta.match(/data:(.*?);base64/);
  const mime = mimeMatch ? mimeMatch[1] : 'application/octet-stream';
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], {type: mime});
}

/* ========================= TOASTS ========================= */
function toast(msg, type, opts){
  type = type || 'info';
  const c = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = `<span>${esc(msg)}</span>`;
  if(opts && opts.undo){
    const btn = document.createElement('button');
    btn.className = 'btn btn-sm'; btn.textContent = 'بازگردانی';
    btn.onclick = ()=>{ opts.undo(); el.remove(); };
    el.appendChild(btn);
  }
  c.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='.3s'; setTimeout(()=>el.remove(),300); }, (opts&&opts.duration)||4500);
}
function savedIndicator(){ toast('ذخیره شد ✓', 'success', {duration:1600}); }

/* ========================= MODAL HELPERS ========================= */
function openModal(html, opts){
  opts = opts || {};
  const root = document.getElementById('modal-root');
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'active-modal-overlay';
  overlay.innerHTML = `<div class="modal ${opts.large?'modal-lg':''}">${html}</div>`;
  overlay.addEventListener('mousedown', (e)=>{ if(e.target === overlay && !opts.noBackdropClose) closeModal(); });
  root.appendChild(overlay);
  return overlay;
}
function closeModal(){
  const el = document.getElementById('active-modal-overlay');
  if(el) el.remove();
}

/* ========================= APP STATE ========================= */
const AppState = {
  projects: [],
  trades: [],
  ideas: [],
  experiments: [],
  ruleVersions: [],
  activeProjectId: null,
  theme: 'light',
  minSampleSize: 20,
  tradeListFilters: {},
  currentRouteHash: '',
  ideaCenterFilters: {},
  lastDeleted: null,
  currentAudioBlob: null,
  currentAudioMeta: null,
  currentScreenshotBlob: null,
  mediaRecorder: null,
  recordChunks: [],
  recordStart: null,
  recordTimer: null,
  recordPaused: 0,
  appName: 'آزمایشگاه بک‌تست',
  affirmations: [],
  calCalendar: 'jalali',
  calYear: null,
  calMonth: null,
  calSelectedDate: null,
};

async function loadAllData(){
  const [projects, trades, ideas, experiments, ruleVersions] = await Promise.all([
    dbGetAll('projects'), dbGetAll('trades'), dbGetAll('ideas'), dbGetAll('experiments'), dbGetAll('ruleVersions')
  ]);
  AppState.projects = projects;
  AppState.trades = trades;
  AppState.ideas = ideas;
  AppState.experiments = experiments;
  AppState.ruleVersions = ruleVersions;
  const themeSetting = localStorage.getItem('btlab_theme');
  if(themeSetting) AppState.theme = themeSetting;
  document.documentElement.setAttribute('data-theme', AppState.theme);
  updateThemeButton();
  const savedActive = localStorage.getItem('btlab_active_project');
  if(savedActive && projects.find(p=>p.id===savedActive)) AppState.activeProjectId = savedActive;
  else if(projects.length) AppState.activeProjectId = projects[0].id;
  const mss = localStorage.getItem('btlab_min_sample');
  if(mss) AppState.minSampleSize = parseInt(mss);
  const savedAppName = localStorage.getItem('btlab_app_name');
  if(savedAppName) AppState.appName = savedAppName;
  const savedAffirmations = localStorage.getItem('btlab_affirmations');
  if(savedAffirmations){ try{ AppState.affirmations = JSON.parse(savedAffirmations) || []; }catch(e){ AppState.affirmations = []; } }
  applyAppBranding();
  updateThemeButton();
  const savedSidebar = localStorage.getItem('btlab_sidebar_collapsed');
  applySidebarState(savedSidebar !== '0');
}

function toggleTheme(){
  AppState.theme = AppState.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', AppState.theme);
  localStorage.setItem('btlab_theme', AppState.theme);
  updateThemeButton();
}

function updateThemeButton(){
  const btn = document.getElementById('theme-btn');
  if(!btn) return;
  const dark = AppState.theme === 'dark';
  btn.innerHTML = `<span class="theme-icon">${dark ? '☀️' : '🌙'}</span><span class="theme-label">${dark ? 'روشن' : 'تاریک'}</span>`;
  btn.title = dark ? 'حالت روشن' : 'حالت تاریک';
}


function applyAppBranding(){
  const name = AppState.appName || 'آزمایشگاه بک‌تست';
  document.title = name + ' | Backtest Lab';
  const brand = document.querySelector('.brand');
  if(brand) brand.innerHTML = `<span class="brand-text">${esc(name)}</span>`;
}

function updateAppName(val){
  const name = String(val || '').trim() || 'آزمایشگاه بک‌تست';
  AppState.appName = name;
  localStorage.setItem('btlab_app_name', name);
  applyAppBranding();
  toast('نام آزمایشگاه ذخیره شد', 'success', {duration:1500});
}

function saveAffirmations(list){
  AppState.affirmations = list.map(x=>String(x).trim()).filter(Boolean);
  localStorage.setItem('btlab_affirmations', JSON.stringify(AppState.affirmations));
}

function addAffirmation(){
  const input = document.getElementById('new-affirmation');
  if(!input) return;
  const value = input.value.trim();
  if(!value){ toast('متن جمله را وارد کنید', 'error'); return; }
  saveAffirmations([...AppState.affirmations, value]);
  input.value = '';
  renderAffirmationsSettings();
  router();
  toast('جمله تأکیدی اضافه شد', 'success', {duration:1500});
}

function removeAffirmation(index){
  const list = [...AppState.affirmations];
  list.splice(index,1);
  saveAffirmations(list);
  renderAffirmationsSettings();
  router();
}

function renderAffirmationsSettings(){
  const el = document.getElementById('affirmations-list');
  if(!el) return;
  el.innerHTML = AppState.affirmations.length ? AppState.affirmations.map((a,i)=>`<div class="flex-between" style="gap:8px; padding:8px 0; border-bottom:1px solid var(--border)"><span>${esc(a)}</span><button class="btn btn-sm" onclick="removeAffirmation(${i})">حذف</button></div>`).join('') : '<div class="small muted">هنوز جمله‌ای اضافه نشده است.</div>';
}

function renderAffirmationsDashboard(){
  if(!AppState.affirmations.length) return '';
  const shown = [...AppState.affirmations].slice(0, 6);
  return `<div class="section-title">✨ جملات تأکیدی</div><div class="card"><div style="display:grid; gap:8px">${shown.map(a=>`<div style="padding:9px 12px; background:var(--bg-alt); border-radius:var(--radius-sm); font-weight:700">${esc(a)}</div>`).join('')}</div>${AppState.affirmations.length>6?`<div class="small muted" style="margin-top:8px">${AppState.affirmations.length-6} جمله دیگر در تنظیمات ذخیره شده است.</div>`:''}</div>`;
}


function getActiveProject(){ return AppState.projects.find(p=>p.id===AppState.activeProjectId) || null; }

/* ========================= CALCULATIONS ========================= */
function computeTradeR(trade){
  // If manual override provided, use it
  if(trade.manualR !== null && trade.manualR !== undefined && trade.manualR !== ''){
    return parseFloat(trade.manualR);
  }
  const risk = parseFloat(trade.riskAmount);
  const money = parseFloat(trade.resultMoney);
  if(!risk || isNaN(risk) || risk===0 || isNaN(money)) return 0;
  return money / risk;
}
function plannedRR(trade){
  const entry = parseFloat(trade.entry), sl = parseFloat(trade.sl), tp = parseFloat(trade.tp);
  if(isNaN(entry)||isNaN(sl)||isNaN(tp)) return null;
  const risk = Math.abs(entry - sl);
  const reward = Math.abs(tp - entry);
  if(risk === 0) return null;
  return reward / risk;
}

function statsForTrades(trades){
  const n = trades.length;
  const wins = trades.filter(t=>t.outcome==='win' || t.outcome==='partial_win');
  const losses = trades.filter(t=>t.outcome==='loss' || t.outcome==='partial_loss');
  const bes = trades.filter(t=>t.outcome==='be');
  const rs = trades.map(t=>computeTradeR(t));
  const totalR = rs.reduce((a,b)=>a+b,0);
  const winRate = n ? wins.length/n : 0;
  const lossRate = n ? losses.length/n : 0;
  const avgR = n ? totalR/n : 0;
  const winRs = wins.map(t=>computeTradeR(t));
  const lossRs = losses.map(t=>computeTradeR(t));
  const avgWin = winRs.length ? winRs.reduce((a,b)=>a+b,0)/winRs.length : 0;
  const avgLoss = lossRs.length ? lossRs.reduce((a,b)=>a+b,0)/lossRs.length : 0;
  const grossProfit = winRs.reduce((a,b)=>a+Math.max(b,0),0);
  const grossLoss = Math.abs(lossRs.reduce((a,b)=>a+Math.min(b,0),0));
  const profitFactor = grossLoss>0 ? grossProfit/grossLoss : (grossProfit>0? Infinity : 0);
  const expectancy = (winRate*avgWin) + (lossRate*avgLoss);
  const largestWin = winRs.length ? Math.max(...winRs) : 0;
  const largestLoss = lossRs.length ? Math.min(...lossRs) : 0;

  // Streaks (based on chronological order)
  const sorted = [...trades].sort((a,b)=> new Date(a.date+'T'+(a.timeIn||'00:00')) - new Date(b.date+'T'+(b.timeIn||'00:00')));
  let curWinStreak=0, maxWinStreak=0, curLossStreak=0, maxLossStreak=0;
  sorted.forEach(t=>{
    if(t.outcome==='win'||t.outcome==='partial_win'){ curWinStreak++; curLossStreak=0; }
    else if(t.outcome==='loss'||t.outcome==='partial_loss'){ curLossStreak++; curWinStreak=0; }
    else { curWinStreak=0; curLossStreak=0; }
    maxWinStreak = Math.max(maxWinStreak, curWinStreak);
    maxLossStreak = Math.max(maxLossStreak, curLossStreak);
  });

  // Equity curve (R based) & drawdown
  let equity = 0, peak = 0, maxDD = 0, curDD = 0;
  const equityCurveR = [];
  sorted.forEach(t=>{
    equity += computeTradeR(t);
    equityCurveR.push(equity);
    peak = Math.max(peak, equity);
    const dd = peak - equity;
    maxDD = Math.max(maxDD, dd);
    curDD = dd;
  });
  const recoveryFactor = maxDD>0 ? totalR/maxDD : (totalR>0? Infinity : 0);

  return {
    n, wins: wins.length, losses: losses.length, bes: bes.length,
    partialWins: trades.filter(t=>t.outcome==='partial_win').length,
    partialLosses: trades.filter(t=>t.outcome==='partial_loss').length,
    winRate, lossRate, totalR, avgR, avgWin, avgLoss, profitFactor, expectancy,
    largestWin, largestLoss, maxWinStreak, maxLossStreak,
    maxDD, curDD, recoveryFactor, equityCurveR, sortedTrades: sorted,
    grossProfit, grossLoss
  };
}

function groupStats(trades, keyFn){
  const groups = {};
  trades.forEach(t=>{
    const k = keyFn(t);
    if(k===null||k===undefined||k==='') return;
    if(!groups[k]) groups[k] = [];
    groups[k].push(t);
  });
  const result = {};
  Object.keys(groups).forEach(k=>{ result[k] = statsForTrades(groups[k]); });
  return result;
}

function bestWorst(groupObj, minSample){
  const entries = Object.entries(groupObj).filter(([k,s])=>s.n >= (minSample||1));
  if(!entries.length) return {best:null, worst:null};
  entries.sort((a,b)=> b[1].expectancy - a[1].expectancy);
  return {best: entries[0], worst: entries[entries.length-1]};
}

/* ========================= FILTER ENGINE ========================= */
function dailyTradePositionMap(trades){
  // Position is determined chronologically within each project + calendar day.
  // This is calculated before the other filters, so N always means the
  // actual first N trades of that day, not the first N trades remaining
  // after symbol/session/result/etc. filters.
  const map = new Map();
  const groups = {};
  (trades||[]).forEach(t=>{
    const key = `${t.projectId}__${t.date}`;
    if(!groups[key]) groups[key] = [];
    groups[key].push(t);
  });
  Object.values(groups).forEach(list=>{
    list.sort((a,b)=>{
      const ak = `${a.date||''}T${a.timeIn||'00:00'}__${a.id||''}`;
      const bk = `${b.date||''}T${b.timeIn||'00:00'}__${b.id||''}`;
      return ak.localeCompare(bk);
    });
    list.forEach((t, idx)=>map.set(t.id, idx+1));
  });
  return map;
}

function applyFilters(trades, f){
  if(!f) return trades;
  const dailyTradeCount = Number.isInteger(f.dailyTradeCount) && f.dailyTradeCount > 0 ? f.dailyTradeCount : null;
  const dailyPositions = dailyTradeCount ? dailyTradePositionMap(trades) : null;
  return trades.filter(t=>{
    if(f.projectId && t.projectId !== f.projectId) return false;
    if(f.tradeNumber && Number(t.tradeNumber) !== Number(f.tradeNumber)) return false;
    if(f.dateFrom && t.date < f.dateFrom) return false;
    if(f.dateTo && t.date > f.dateTo) return false;
    if(dailyTradeCount){
      const pos = dailyPositions.get(t.id);
      if(!pos || pos > dailyTradeCount) return false;
    }
    if(Array.isArray(f.hourRanges) && f.hourRanges.length){
      const h = tradeHourIndex(t);
      if(h===null || !f.hourRanges.includes(h)) return false;
    }
    if(Array.isArray(f.weekdays) && f.weekdays.length){
      const wd = new Date(t.date + 'T12:00:00').getDay();
      const faIndex = (wd + 1) % 7;
      if(!f.weekdays.includes(faIndex)) return false;
    }
    if(f.symbol && t.symbol !== f.symbol) return false;
    if(f.timeframe && t.timeframe !== f.timeframe) return false;
    if(f.session && t.session !== f.session) return false;
    if(f.direction && t.direction !== f.direction) return false;
    if(f.setupQuality && t.setupQuality !== f.setupQuality) return false;
    if(f.outcome && t.outcome !== f.outcome) return false;
    if(f.weekday && weekdayFa(t.date) !== f.weekday) return false;
    if(f.hour && tradeHour(t) !== f.hour) return false;
    if(f.rSign === 'positive' && computeTradeR(t) <= 0) return false;
    if(f.rSign === 'negative' && computeTradeR(t) >= 0) return false;
    if(f.hasScreenshot && !t.screenshotId) return false;
    if(f.hasIdea){
      const linked = AppState.ideas.some(i=>i.tradeId===t.id);
      if(!linked) return false;
    }
    if(f.allRulesFollowed){
      const proj = AppState.projects.find(p=>p.id===t.projectId);
      if(proj && proj.rules && proj.rules.length){
        const allFollowed = proj.rules.every(r=> t.rulesFollowed && t.rulesFollowed[r.id]);
        if(!allFollowed) return false;
      }
    }
    if(f.specificRuleId){
      const followed = !!(t.rulesFollowed && t.rulesFollowed[f.specificRuleId]);
      if(f.specificRuleState === 'followed' && !followed) return false;
      if(f.specificRuleState === 'not_followed' && followed) return false;
    }
    return true;
  });
}

    {t:'معاملات بعد از ساعت ۱۱ عملکرد ضعیف‌تری دارند.', type:'Time'},

function proEquityData(trades){
  const sorted=[...(trades||[])].sort((a,b)=>new Date(a.date+'T'+(a.timeIn||'00:00'))-new Date(b.date+'T'+(b.timeIn||'00:00')));
  let equity=0,peak=0;
  return sorted.map((t,i)=>{
    const r=computeTradeR(t); equity+=r; peak=Math.max(peak,equity);
    const dd=peak-equity;
    return {trade:t,index:i+1,r,equity,drawdown:dd};
  });
}

function proEquityChart(data,mode='equity'){
  const W=1200,H=500,pad={t:28,r:30,b:58,l:64},iw=W-pad.l-pad.r,ih=H-pad.t-pad.b;
  if(!data.length) return noDataMsg();
  const values = mode==='drawdown' ? data.map(d=>-d.drawdown) : mode==='r' ? data.map(d=>d.r) : data.map(d=>d.equity);
  let minV=Math.min(0,...values),maxV=Math.max(0,...values); if(minV===maxV){minV-=1;maxV+=1;}
  const extra=(maxV-minV)*.08||1; minV-=extra; maxV+=extra;
  window._proEquityScale={minV,maxV};
  const x=i=>pad.l+(data.length===1?iw/2:(i/(data.length-1))*iw);
  const y=v=>pad.t+ih-((v-minV)/(maxV-minV))*ih;
  let grid='';
  for(let i=0;i<=5;i++){const v=minV+(maxV-minV)*i/5,yy=y(v);grid+=`<line x1="${pad.l}" y1="${yy}" x2="${W-pad.r}" y2="${yy}" stroke="var(--border)"/><text x="${pad.l-9}" y="${yy+4}" font-size="11" text-anchor="end" fill="var(--text-faint)">${v.toFixed(1)}R</text>`;}
  const zeroY=y(0); grid+=`<line x1="${pad.l}" y1="${zeroY}" x2="${W-pad.r}" y2="${zeroY}" stroke="var(--text-faint)" stroke-dasharray="5,5"/>`;
  const pts=data.map((d,i)=>`${x(i)},${y(values[i])}`).join(' ');
  const area=`${x(0)},${zeroY} ${pts} ${x(data.length-1)},${zeroY}`;

/* ========================= NAVIGATION STATE / SCROLL RESTORE ========================= */
function currentRouteHash(){ return location.hash.replace(/^#/, '') || 'dashboard'; }
function captureTradeReturnState(sourceHash){
  const hash = sourceHash || currentRouteHash();
  const table = hash === 'equity-pro'
    ? document.querySelector('.pro-equity-table-wrap')
    : (hash === 'trades' ? document.querySelector('.table-scroll') : null);
  return {
    hash,
    windowScrollY: hash === 'trades' ? 0 : Math.max(0, window.scrollY || window.pageYOffset || 0),
    tableScrollTop: table ? Math.max(0, table.scrollTop || 0) : 0
  };
}
function saveTradeReturn(sourceHash){
  const state = captureTradeReturnState(sourceHash);
  try{ sessionStorage.setItem('btlab_trade_return', JSON.stringify(state)); }
  catch(e){ window._tradeReturnFallback=state; }
}
function getTradeReturn(){
  try{
    const raw=sessionStorage.getItem('btlab_trade_return');
    if(raw){ const x=JSON.parse(raw); if(x && x.hash) return x; }
  }catch(e){}
  return window._tradeReturnFallback || null;
}
function clearTradeReturn(){
  try{ sessionStorage.removeItem('btlab_trade_return'); }catch(e){}
  window._tradeReturnFallback=null;
}
function restoreTradeReturnState(ret){
  if(!ret) return;
  const targetWindow=ret.hash==='trades' ? 0 : Math.max(0,Number(ret.windowScrollY ?? ret.scrollY)||0);
  const targetTable=Math.max(0,Number(ret.tableScrollTop)||0);
  let tries=0;
  const restore=()=>{
     window.scrollTo(0,targetWindow);
    let table=null;
    if(ret.hash==='equity-pro') table=document.querySelector('.pro-equity-table-wrap');
    if(ret.hash==='trades') table=document.querySelector('.table-scroll');
    if(table) table.scrollTop=targetTable;
    tries++;
    const okWindow=Math.abs((window.scrollY||0)-targetWindow)<=3;
    const okTable=!table || Math.abs(table.scrollTop-targetTable)<=3;
    if(tries<30 && (!okWindow || !okTable)) requestAnimationFrame(restore);
  };
  requestAnimationFrame(restore);
}
function goToTrade(tradeId, sourceHash){
  saveTradeReturn(sourceHash);
  location.hash='trade-new/'+tradeId;
}
function goToTradeNew(sourceHash){
  saveTradeReturn(sourceHash);
  location.hash='trade-new';
}
function backFromTrade(){
  const ret=getTradeReturn();
  if(ret && ret.hash){
    clearTradeReturn();
    window._pendingTradeReturn=ret;
    location.hash=ret.hash;
    return;
  }
  location.hash='trades';
}

function router(){
  renderNav();
  const hash=currentRouteHash();
  const [base,param]=hash.split('/');
  const fn=VIEW_FNS[base] || VIEW_FNS['dashboard'];
  const content=document.getElementById('content');
  content.classList.toggle('trades-page', base === 'trades');
  try{ fn(param); }
  catch(err){ console.error(err); content.innerHTML=`<div class="empty-state"><div class="big">⚠️</div><p>خطایی در نمایش صفحه رخ داد.</p><p class="small">${esc(err.message||'')}</p></div>`; }
  const pending=window._pendingTradeReturn;
  if(pending && pending.hash===hash){
    window._pendingTradeReturn=null;
    restoreTradeReturnState(pending);
  }
}
window.addEventListener('hashchange',router);

function svgLineChart(opts){

function chartByGroup(groupObj,minSample,order){

  if(order) keys=order.filter(k=>groupObj[k]); else keys.sort();
  keys=keys.slice(0,24);
  if(!keys.length) return noDataMsg();
  return svgBarChart({labels:keys,values:keys.map(k=>groupObj[k].totalR),colors:keys.map(k=>groupObj[k].totalR>=0?'var(--win)':'var(--loss)')});
}

function dashKpi(icon,label,value,sub,cls,progress){
  return `<div class="dashboard-kpi ${cls||''}">
    <div class="dashboard-kpi-top"><div class="dashboard-kpi-label">${label}</div><div class="dashboard-kpi-icon">${icon}</div></div>
    <div class="dashboard-kpi-value">${value}</div>
    <div class="dashboard-kpi-sub">${sub||''}</div>
    ${progress!==undefined?`<div class="dashboard-kpi-progress"><span style="width:${progress}%"></span></div>`:''}
  </div>`;
}

function dashLegendRow(color,label,count,pct){
  return `<div class="dashboard-legend-row"><div class="dashboard-legend-label"><span class="dashboard-dot" style="background:${color}"></span>${label}</div><div class="dashboard-legend-value">${count} <span class="small muted">(${pct}٪)</span></div></div>`;
}

function dashBreakdown(title,groupObj,order){
  let keys = Object.keys(groupObj||{});
  if(order) keys = order.filter(k=>groupObj[k]);
  else keys.sort((a,b)=>(groupObj[b].totalR-groupObj[a].totalR));
  keys = keys.slice(0,6);
  return `<div class="dashboard-breakdown"><h4>${title}</h4>${keys.length ? keys.map(k=>{
    const g=groupObj[k];
    const cls=g.totalR>=0?'pos':'neg';
    return `<div class="dashboard-breakdown-row"><span class="dashboard-breakdown-name">${esc(k)}</span><span class="dashboard-breakdown-value ${cls}">${fmtR(g.totalR)}</span></div>`;
  }).join('') : '<div class="small muted">داده‌ای نیست.</div>'}</div>`;
}

function dashInsight(icon,title,bw){
  const render = e => e ? `<b>${esc(e[0])}</b> <span class="small muted">· ${e[1].n} معامله · Exp ${fmtR(e[1].expectancy)}</span>` : '<span class="small muted">نمونه کافی نیست</span>';
  return `<div class="dashboard-insight"><div class="dashboard-insight-label">${icon} ${title}</div><div class="dashboard-insight-main">${render(bw.best)}</div><div class="small muted">بهترین گروه با حداقل نمونه</div></div>`;
}

function dashTradeRow(t){
  const date = t.date ? jalaliDate(t.date) : '—';
  const time = t.timeIn || '—';
  const outcome = outcomeLabel(t.outcome);
  const r = computeTradeR(t);
  return `<div class="dashboard-trade-row">
    <div class="dashboard-trade-date">${esc(date)}<br>${esc(time)}</div>
    <div><div class="dashboard-trade-symbol">${esc(t.symbol||'—')}</div><div class="dashboard-trade-meta">${esc(t.timeframe||'—')} · ${esc(t.session||'—')}</div></div>
    <div class="dashboard-trade-result">${outcome}</div>
    <div class="dashboard-trade-r ${r>=0?'pos':'neg'}">${fmtR(r)}</div>
  </div>`;
}

async function saveProject(existingId){
  const name = document.getElementById('pf-name').value.trim();
  const symbol = document.getElementById('pf-symbol').value.trim();
  if(!name || !symbol){ toast('نام پروژه و نماد الزامی است', 'error'); return; }
  let p = existingId ? AppState.projects.find(x=>x.id===existingId) : null;
  const isNew = !p;
  if(!p) p = {id: uid('proj'), rules:[], createdAt: nowISO()};
  p.name = name;
  p.strategy = document.getElementById('pf-strategy').value.trim();
  p.symbol = symbol;
  p.timeframe = document.getElementById('pf-timeframe').value.trim();
  p.session = document.getElementById('pf-session').value;
  p.dateStart = document.getElementById('pf-start').value;
  p.dateEnd = document.getElementById('pf-end').value;
  p.initialCapital = parseFloat(document.getElementById('pf-capital').value)||0;
  p.defaultRisk = parseFloat(document.getElementById('pf-risk').value)||0;
  p.currency = document.getElementById('pf-currency').value.trim()||'USD';
  p.status = document.getElementById('pf-status').value;
  p.description = document.getElementById('pf-desc').value.trim();
  p.rules = p.rules || [];
  p.updatedAt = nowISO();
  await dbPut('projects', p);
  if(isNew) AppState.projects.push(p);
  if(isNew && !AppState.activeProjectId) setActiveProject(p.id);
  closeModal();
  savedIndicator();
  renderProjectSelect();
  router();
}

async function deleteProject(id){
  const p = AppState.projects.find(x=>x.id===id);
  if(!confirm(`آیا مطمئن هستید می‌خواهید پروژه «${p.name}» را حذف کنید؟\nتمام معاملات و ایده‌های مرتبط نیز حذف خواهند شد. این عملیات قابل بازگشت نیست.`)) return;
  if(!confirm('تأیید نهایی: این عملیات غیرقابل بازگشت است. ادامه می‌دهید؟')) return;
  const trades = AppState.trades.filter(t=>t.projectId===id);
  const ideas = AppState.ideas.filter(i=>i.projectId===id);
  for(const t of trades){ await dbDelete('trades', t.id); }
  for(const i of ideas){ await dbDelete('ideas', i.id); }
  await dbDelete('projects', id);
  AppState.trades = AppState.trades.filter(t=>t.projectId!==id);
  AppState.ideas = AppState.ideas.filter(i=>i.projectId!==id);
  AppState.projects = AppState.projects.filter(x=>x.id!==id);
  if(AppState.activeProjectId===id) AppState.activeProjectId = AppState.projects[0]?AppState.projects[0].id:null;
  toast('پروژه حذف شد', 'success');
  renderProjectSelect();
  router();
}

async function addRule(projectId){
  const input = document.getElementById('new-rule-text');
  const text = input.value.trim();
  if(!text) return;
  const p = AppState.projects.find(x=>x.id===projectId);
  p.rules = p.rules || [];
  p.rules.push({id: uid('rule'), text});
  await dbPut('projects', p);
  savedIndicator();
  closeModal();
  renderRulesModal(p);
}
async function removeRule(projectId, ruleId){
  const p = AppState.projects.find(x=>x.id===projectId);
  p.rules = (p.rules||[]).filter(r=>r.id!==ruleId);
  await dbPut('projects', p);
  savedIndicator();
  closeModal();
  renderRulesModal(p);
}
async function snapshotRuleVersion(projectId){
  const p = AppState.projects.find(x=>x.id===projectId);
  const versionCount = AppState.ruleVersions.filter(v=>v.projectId===projectId).length;
  const v = {id: uid('rv'), projectId, versionLabel: 'v' + (versionCount+1) + '.0', rules: JSON.parse(JSON.stringify(p.rules||[])), createdAt: nowISO()};
  await dbPut('ruleVersions', v);
  AppState.ruleVersions.push(v);
  toast('نسخه قوانین ثبت شد: ' + v.versionLabel, 'success');
}

function updateWeekdayDisplay(){
  document.getElementById('tf-weekday').value = weekdayFa(document.getElementById('tf-date').value);
}
function updatePlannedRR(){
  const entry = parseFloat(document.getElementById('tf-entry').value);
  const sl = parseFloat(document.getElementById('tf-sl').value);
  const tp = parseFloat(document.getElementById('tf-tp').value);
  const el = document.getElementById('tf-plannedrr');
  if(isNaN(entry)||isNaN(sl)||isNaN(tp)||entry===sl){ el.value = '—'; return; }
  const rr = Math.abs(tp-entry)/Math.abs(entry-sl);
  el.value = '1 : ' + rr.toFixed(2);
}
function toggleManualR(){
  const on = document.getElementById('tf-manual-toggle').checked;
  document.getElementById('tf-manualr').disabled = !on;
  updateComputedR();
}
function updateComputedR(){
  const manualOn = document.getElementById('tf-manual-toggle').checked;
  const el = document.getElementById('tf-computedr');
  if(manualOn){
    const v = parseFloat(document.getElementById('tf-manualr').value);
    el.value = isNaN(v) ? '—' : fmtR(v);
    return;
  }
  const risk = parseFloat(document.getElementById('tf-risk').value);
  const money = parseFloat(document.getElementById('tf-money').value);
  if(!risk || isNaN(money)){ el.value = '—'; return; }
  el.value = fmtR(money/risk);
}

function handleScreenshotSelect(e){
  const file = e.target.files[0];
  if(!file) return;
  AppState.currentScreenshotBlob = file;
  const url = URL.createObjectURL(file);
  document.getElementById('tf-screenshot-preview').innerHTML = `<img src="${url}" style="max-width:100%; border-radius:8px; border:1px solid var(--border)">`;
}
async function loadScreenshotPreview(screenshotId){

function validateTradeForm(){
  const errors = [];
  const date = document.getElementById('tf-date').value;
  const symbol = document.getElementById('tf-symbol').value.trim();
  const risk = document.getElementById('tf-risk').value;
  const outcomeEl = document.querySelector('input[name="tf-outcome"]:checked');
  if(!date) errors.push('تاریخ معامله نامعتبر است.');
  if(!symbol) errors.push('نماد نمی‌تواند خالی باشد.');
  if(!risk || parseFloat(risk)<=0) errors.push('مقدار ریسک باید بزرگتر از صفر باشد.');
  if(!outcomeEl) errors.push('نتیجه معامله را انتخاب کنید.');
  const timeIn = document.getElementById('tf-timein').value;
  const timeOut = document.getElementById('tf-timeout').value;
  if(timeIn && timeOut && timeOut < timeIn){
    // allow overnight but warn only, not blocking
  }
  const manualOn = document.getElementById('tf-manual-toggle').checked;
  if(manualOn && document.getElementById('tf-manualr').value===''){
    errors.push('در حالت ویرایش دستی R، مقدار R را وارد کنید.');
  }
  return errors;
}

async function saveTrade(){
  const errors = validateTradeForm();
  if(errors.length){ toast(errors[0], 'error'); return; }
  const proj = getActiveProject();
  const isEdit = !!AppState.editingTradeId;
  let trade = isEdit ? AppState.trades.find(t=>t.id===AppState.editingTradeId) : {id: uid('trade'), projectId: proj.id, createdAt: nowISO()};

  trade.tradeNumber = parseInt(document.getElementById('tf-num').value) || trade.tradeNumber;
  trade.date = document.getElementById('tf-date').value;
  trade.timeIn = document.getElementById('tf-timein').value;
  trade.timeOut = document.getElementById('tf-timeout').value;
  trade.session = document.getElementById('tf-session').value;
  trade.symbol = document.getElementById('tf-symbol').value.trim();
  trade.timeframe = document.getElementById('tf-tf').value.trim();
  trade.direction = document.getElementById('tf-direction').value;
  trade.entry = document.getElementById('tf-entry').value;
  trade.sl = document.getElementById('tf-sl').value;
  trade.tp = document.getElementById('tf-tp').value;
  trade.actualExit = document.getElementById('tf-actualexit').value;
  trade.riskAmount = parseFloat(document.getElementById('tf-risk').value);
  trade.resultMoney = parseFloat(document.getElementById('tf-money').value) || 0;
  const manualOn = document.getElementById('tf-manual-toggle').checked;
  trade.manualR = manualOn ? parseFloat(document.getElementById('tf-manualr').value) : null;
  trade.outcome = document.querySelector('input[name="tf-outcome"]:checked').value;
  trade.setupQuality = document.getElementById('tf-quality').value;
  trade.rulesFollowed = trade.rulesFollowed || {};
  document.querySelectorAll('#tf-rules input[data-rule]').forEach(cb=>{
    trade.rulesFollowed[cb.dataset.rule] = cb.checked;
  });
  trade.notes = {
    preEntry: document.getElementById('tf-preentry').value,
    entryReason: document.getElementById('tf-entryreason').value,
    marketCondition: document.getElementById('tf-marketcond').value,
    management: document.getElementById('tf-management').value,
    exitReason: document.getElementById('tf-exitreason').value,
    mistakes: document.getElementById('tf-mistakes').value,
    lesson: document.getElementById('tf-lesson').value,
  };
  trade.updatedAt = nowISO();

  // Screenshot handling
  if(AppState.currentScreenshotBlob === 'REMOVE'){
    if(trade.screenshotId){ await dbDelete('screenshots', trade.screenshotId).catch(()=>{}); }
    trade.screenshotId = null;
  } else if(AppState.currentScreenshotBlob instanceof Blob || (AppState.currentScreenshotBlob && AppState.currentScreenshotBlob.type)){
    const ssId = trade.screenshotId || uid('shot');
    await dbPut('screenshots', {id: ssId, blob: AppState.currentScreenshotBlob, tradeId: trade.id, createdAt: nowISO()});
    trade.screenshotId = ssId;
  }

  await dbPut('trades', trade);
  if(!isEdit) AppState.trades.push(trade);
  savedIndicator();
  const ret = getTradeReturn();
  if(ret && ret.hash){ backFromTrade(); } else { location.hash = 'trades'; }
}

async function deleteTrade(id){
  const trade = AppState.trades.find(t=>t.id===id);
  if(!confirm('آیا از حذف این معامله مطمئن هستید؟')) return;
  const snapshot = JSON.parse(JSON.stringify(trade));
  await dbDelete('trades', id);
  AppState.trades = AppState.trades.filter(t=>t.id!==id);
  toast('معامله حذف شد', 'info', {undo: async ()=>{
    await dbPut('trades', snapshot);
    AppState.trades.push(snapshot);
    toast('بازگردانی شد', 'success');
    router();
  }});
  const ret = getTradeReturn();
  if(ret && ret.hash){ backFromTrade(); } else { location.hash = 'trades'; }
}

let _tradeScreenshotViewer = null;
let _tradeScreenshotObjectUrl = null;
let _tradeScreenshotZoom = 1;
let _tradeScreenshotPanX = 0;
let _tradeScreenshotPanY = 0;
let _tradeScreenshotDragging = false;
let _tradeScreenshotDragStartX = 0;
let _tradeScreenshotDragStartY = 0;
let _tradeScreenshotStartPanX = 0;
let _tradeScreenshotStartPanY = 0;

function updateTradeScreenshotTransform(){
  const img = document.getElementById('trade-screenshot-viewer-img');
  const zoomLabel = document.getElementById('trade-screenshot-zoom');
  if(img){
    img.style.transform = `translate(${_tradeScreenshotPanX}px, ${_tradeScreenshotPanY}px) scale(${_tradeScreenshotZoom})`;
  }
  if(zoomLabel) zoomLabel.textContent = `${Math.round(_tradeScreenshotZoom*100)}%`;
}
function clampTradeScreenshotPan(){
  const stage = document.getElementById('trade-screenshot-viewer-stage');
  const img = document.getElementById('trade-screenshot-viewer-img');
  if(!stage || !img) return;
  const maxX = Math.max(0, (img.naturalWidth * _tradeScreenshotZoom - stage.clientWidth) / 2 + stage.clientWidth * .15);
  const maxY = Math.max(0, (img.naturalHeight * _tradeScreenshotZoom - stage.clientHeight) / 2 + stage.clientHeight * .15);
  _tradeScreenshotPanX = Math.max(-maxX, Math.min(maxX, _tradeScreenshotPanX));
  _tradeScreenshotPanY = Math.max(-maxY, Math.min(maxY, _tradeScreenshotPanY));
}
function setTradeScreenshotZoom(next, centerX, centerY){
  const old = _tradeScreenshotZoom;
  _tradeScreenshotZoom = Math.max(.25, Math.min(5, next));
  if(centerX != null && centerY != null && old !== _tradeScreenshotZoom){
    const stage = document.getElementById('trade-screenshot-viewer-stage');
    if(stage){
      const rect = stage.getBoundingClientRect();
      const px = centerX - (rect.left + rect.width/2);
      const py = centerY - (rect.top + rect.height/2);
      const ratio = _tradeScreenshotZoom / old;
      _tradeScreenshotPanX = px - (px - _tradeScreenshotPanX) * ratio;
      _tradeScreenshotPanY = py - (py - _tradeScreenshotPanY) * ratio;
    }
  }
  if(_tradeScreenshotZoom <= 1){ _tradeScreenshotPanX = 0; _tradeScreenshotPanY = 0; }
  clampTradeScreenshotPan();
  updateTradeScreenshotTransform();
}
function resetTradeScreenshotZoom(){
  _tradeScreenshotZoom = 1; _tradeScreenshotPanX = 0; _tradeScreenshotPanY = 0;
  updateTradeScreenshotTransform();
}
function closeTradeScreenshotViewer(){
  if(_tradeScreenshotViewer) _tradeScreenshotViewer.remove();
  _tradeScreenshotViewer = null;
  if(_tradeScreenshotObjectUrl){ URL.revokeObjectURL(_tradeScreenshotObjectUrl); _tradeScreenshotObjectUrl = null; }
  document.body.style.overflow = '';
}
function openTradeScreenshotViewer(){
  const stage = document.getElementById('trade-screenshot-viewer-stage');
  const img = document.getElementById('trade-screenshot-viewer-img');
  if(!stage || !img) return;
  stage.onwheel = function(e){
    e.preventDefault();
    const step = e.deltaY < 0 ? 1.15 : 1/1.15;
    setTradeScreenshotZoom(_tradeScreenshotZoom * step, e.clientX, e.clientY);
  };
  stage.onmousedown = function(e){
    if(e.button !== 0 || _tradeScreenshotZoom <= 1) return;
    _tradeScreenshotDragging = true;
    _tradeScreenshotDragStartX = e.clientX; _tradeScreenshotDragStartY = e.clientY;
    _tradeScreenshotStartPanX = _tradeScreenshotPanX; _tradeScreenshotStartPanY = _tradeScreenshotPanY;
    stage.classList.add('dragging');
  };
  window.addEventListener('mousemove', _tradeScreenshotViewerMove);
  window.addEventListener('mouseup', _tradeScreenshotViewerUp);
  img.onload = ()=>{ clampTradeScreenshotPan(); updateTradeScreenshotTransform(); };
  updateTradeScreenshotTransform();
}
function _tradeScreenshotViewerMove(e){
  if(!_tradeScreenshotDragging) return;
  _tradeScreenshotPanX = _tradeScreenshotStartPanX + e.clientX - _tradeScreenshotDragStartX;
  _tradeScreenshotPanY = _tradeScreenshotStartPanY + e.clientY - _tradeScreenshotDragStartY;
  clampTradeScreenshotPan(); updateTradeScreenshotTransform();
}
function _tradeScreenshotViewerUp(){
  _tradeScreenshotDragging = false;
  const stage = document.getElementById('trade-screenshot-viewer-stage');
  if(stage) stage.classList.remove('dragging');
}
async function openTradeScreenshot(screenshotId){
  if(!screenshotId) return;
  try{
    const rec = await dbGet('screenshots', screenshotId);
    if(!rec || !rec.blob) return;
    closeTradeScreenshotViewer();
    _tradeScreenshotZoom = 1; _tradeScreenshotPanX = 0; _tradeScreenshotPanY = 0;
    _tradeScreenshotObjectUrl = URL.createObjectURL(rec.blob);
    _tradeScreenshotViewer = document.createElement('div');
    _tradeScreenshotViewer.id = 'trade-screenshot-viewer';
    _tradeScreenshotViewer.innerHTML = `

        </div>

    document.body.appendChild(_tradeScreenshotViewer);

    _tradeScreenshotViewer.addEventListener('mousedown', e=>{ if(e.target===_tradeScreenshotViewer) closeTradeScreenshotViewer(); });
    openTradeScreenshotViewer();
  }catch(err){ console.error(err); }

function scrollToTradeNumber(tradeNumber){
  const table=document.querySelector('#trade-list-container .table-scroll');
  if(!table) return;
  const row=[...table.querySelectorAll('tbody tr.trade-row')].find(tr=>{
    const cell=tr.querySelector('td');
    return cell && Number(cell.textContent.trim())===Number(tradeNumber);
  });
  if(!row){
    toast('معامله شماره '+tradeNumber+' پیدا نشد.', 'error');
    return;
  }
  requestAnimationFrame(()=>{
    const target=Math.max(0,row.offsetTop - Math.max(0,(table.clientHeight-row.offsetHeight)/2));
    table.scrollTo({top:target,behavior:'smooth'});
    row.animate([{backgroundColor:'var(--primary-soft)'},{backgroundColor:'transparent'}],{duration:1400,easing:'ease-out'});
  });
}

const CAL_MONTH_NAMES_J = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const CAL_MONTH_NAMES_G = ['ژانویه','فوریه','مارس','آوریل','مه','ژوئن','ژوئیه','اوت','سپتامبر','اکتبر','نوامبر','دسامبر'];
const CAL_WEEK_J = ['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'];
const CAL_WEEK_G = ['یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه','شنبه'];

function calFaDigits(value){
  return String(value).replace(/\d/g, d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
}
function calPad2(n){ return String(n).padStart(2,'0'); }
function calGregorianDateStr(y,m,d){ return `${y}-${calPad2(m)}-${calPad2(d)}`; }
function calParseDateStr(dateStr){
  const m = String(dateStr||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m ? {y:+m[1],m:+m[2],d:+m[3]} : null;
}
function calUtc(y,m,d){ return Date.UTC(y,m-1,d); }
function calDaysBetween(a,b){ return Math.round((b-a)/86400000); }

/* Gregorian <-> Jalali conversion, self-contained and independent of browser locale. */
function gregorianToJalali(gy, gm, gd){
  const gdm = [31,28,31,30,31,30,31,31,30,31,30,31];
  let y = gy - 1600;
  let m = gm - 1;
  let d = gd - 1;
  let gDayNo = 365*y + Math.floor((y+3)/4) - Math.floor((y+99)/100) + Math.floor((y+399)/400);
  for(let i=0;i<m;i++) gDayNo += gdm[i];
  if(m>1 && ((gy%4===0 && gy%100!==0) || gy%400===0)) gDayNo++;
  gDayNo += d;
  let jDayNo = gDayNo - 79;
  const jNp = Math.floor(jDayNo / 12053);
  jDayNo %= 12053;
  let jy = 979 + 33*jNp + 4*Math.floor(jDayNo/1461);
  jDayNo %= 1461;
  if(jDayNo >= 366){
    jy += Math.floor((jDayNo-1)/365);
    jDayNo = (jDayNo-1)%365;
  }
  const jm = jDayNo < 186 ? 1 + Math.floor(jDayNo/31) : 7 + Math.floor((jDayNo-186)/30);
  const jd = 1 + (jDayNo < 186 ? jDayNo%31 : (jDayNo-186)%30);
  return {y:jy,m:jm,d:jd};
}
function jalaliToGregorian(jy, jm, jd){
  let jy2 = jy + 1595;
  let days = -355668 + 365*jy2 + Math.floor(jy2/33)*8 + Math.floor(((jy2%33)+3)/4) + jd;
  days += jm < 7 ? (jm-1)*31 : (jm-1)*30 + 6;
  let gy = 400 * Math.floor(days/146097);
  days %= 146097;
  if(days > 36524){
    gy += 100 * Math.floor(--days/36524);
    days %= 36524;
    if(days >= 365) days++;
  }
  gy += 4 * Math.floor(days/1461);
  days %= 1461;
  if(days > 365){
    gy += Math.floor((days-1)/365);
    days = (days-1)%365;
  }
  let gd = days + 1;
  const leap = (gy%4===0 && gy%100!==0) || gy%400===0;
  const gdm = [31, leap?29:28,31,30,31,30,31,31,30,31,30,31];
  let gm=1;
  while(gm<=12 && gd>gdm[gm-1]){ gd-=gdm[gm-1]; gm++; }
  return {y:gy,m:gm,d:gd};
}
function jalaliMonthDays(jy,jm){
  if(jm<=6) return 31;
  if(jm<=11) return 30;
  const a = jalaliToGregorian(jy,12,1);
  const b = jalaliToGregorian(jy+1,1,1);
  return calDaysBetween(calUtc(a.y,a.m,a.d), calUtc(b.y,b.m,b.d));
}
function calDatePartsFromGregorian(dateStr){
  const g = calParseDateStr(dateStr);
  return g ? gregorianToJalali(g.y,g.m,g.d) : null;
}
function calWeekdayIndexGregorian(y,m,d){ return new Date(Date.UTC(y,m-1,d)).getUTCDay(); }
function calWeekdayIndexJalali(y,m,d){
  const g = jalaliToGregorian(y,m,d);

}
function calTodayGregorianStr(){
  const d = new Date();
  return calGregorianDateStr(d.getFullYear(),d.getMonth()+1,d.getDate());
}
function calFormatJalali(j){
  return `${calFaDigits(j.d)} ${CAL_MONTH_NAMES_J[j.m-1]} ${calFaDigits(j.y)}`;
}
function calFormatGregorian(g){
  return `${calFaDigits(g.d)} ${CAL_MONTH_NAMES_G[g.m-1]} ${calFaDigits(g.y)}`;
}
function calEquivalentRange(){
  const c = AppState.calCalendar;
  if(c==='jalali'){
    const firstG = jalaliToGregorian(AppState.calYear,AppState.calMonth,1);
    const lastG = jalaliToGregorian(AppState.calYear,AppState.calMonth,jalaliMonthDays(AppState.calYear,AppState.calMonth));
    const first = `${CAL_MONTH_NAMES_G[firstG.m-1]} ${calFaDigits(firstG.y)}`;
    const last = `${CAL_MONTH_NAMES_G[lastG.m-1]} ${calFaDigits(lastG.y)}`;
    return first===last ? first : `${first} تا ${last}`;
  }
  const firstJ = gregorianToJalali(AppState.calYear,AppState.calMonth,1);
  const lastDay = new Date(Date.UTC(AppState.calYear,AppState.calMonth,0)).getUTCDate();
  const lastJ = gregorianToJalali(AppState.calYear,AppState.calMonth,lastDay);
  const first = `${CAL_MONTH_NAMES_J[firstJ.m-1]} ${calFaDigits(firstJ.y)}`;
  const last = `${CAL_MONTH_NAMES_J[lastJ.m-1]} ${calFaDigits(lastJ.y)}`;
  return first===last ? first : `${first} تا ${last}`;
}
function calHeaderTitle(){
  return AppState.calCalendar==='jalali'
    ? `${CAL_MONTH_NAMES_J[AppState.calMonth-1]} ${calFaDigits(AppState.calYear)}`
    : `${CAL_MONTH_NAMES_G[AppState.calMonth-1]} ${calFaDigits(AppState.calYear)}`;
}
function calCellData(year,month,day){
  let g,j,isCurrentMonth=false,weekday;
  if(AppState.calCalendar==='jalali'){
    j={y:year,m:month,d:day}; g=jalaliToGregorian(year,month,day); isCurrentMonth=true; weekday=calWeekdayIndexJalali(year,month,day);
  }else{
    g={y:year,m:month,d:day}; j=gregorianToJalali(year,month,day); isCurrentMonth=true; weekday=calWeekdayIndexGregorian(year,month,day);
  }
  return {g,j,dateStr:calGregorianDateStr(g.y,g.m,g.d),weekday,isCurrentMonth};
}
function calShiftMonth(delta){
  let y=AppState.calYear, m=AppState.calMonth+delta;

    while(m<1){m+=12;y--;} while(m>12){m-=12;y++;}

/* ---- Voice recording via MediaRecorder ---- */
async function startVoiceRecording(){
  document.getElementById('rec-error').textContent = '';
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    document.getElementById('rec-error').textContent = 'مرورگر شما از ضبط صدا پشتیبانی نمی‌کند. می‌توانید ایده را به صورت متنی ثبت کنید.';
    return;
  }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    AppState.recordChunks = [];
    const mime = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : (MediaRecorder.isTypeSupported('audio/ogg')?'audio/ogg':'');
    AppState.mediaRecorder = mime ? new MediaRecorder(stream, {mimeType:mime}) : new MediaRecorder(stream);
    AppState.mediaRecorder.ondataavailable = e=>{ if(e.data.size>0) AppState.recordChunks.push(e.data); };
    AppState.mediaRecorder.onstop = ()=>{
      const blob = new Blob(AppState.recordChunks, {type: AppState.mediaRecorder.mimeType || 'audio/webm'});
      AppState.currentAudioBlob = blob;
      stream.getTracks().forEach(tr=>tr.stop());
      renderAudioPlayback(blob);
    };
    AppState.mediaRecorder.start();
    AppState.recordStart = Date.now();
    AppState.recordPaused = 0;
    document.getElementById('rec-start-btn').style.display='none';
    document.getElementById('rec-pause-btn').style.display='inline-flex';
    document.getElementById('rec-stop-btn').style.display='inline-flex';
    tickRecordTimer();
  }catch(err){
    document.getElementById('rec-error').textContent = 'دسترسی به میکروفون امکان‌پذیر نبود. ثبت متنی ایده همچنان فعال است. (' + (err.message||'') + ')';
  }
}
function tickRecordTimer(){
  if(!AppState.mediaRecorder || AppState.mediaRecorder.state==='inactive') return;
  const elapsed = Math.floor((Date.now()-AppState.recordStart)/1000);
  const mm = String(Math.floor(elapsed/60)).padStart(2,'0'), ss = String(elapsed%60).padStart(2,'0');
  const timerEl = document.getElementById('rec-timer');
  if(timerEl) timerEl.textContent = (AppState.mediaRecorder.state==='paused'?'⏸ ':'🔴 ') + mm+':'+ss;
  AppState.recordTimer = setTimeout(tickRecordTimer, 500);
}
function pauseResumeRecording(){
  if(!AppState.mediaRecorder) return;
  if(AppState.mediaRecorder.state==='recording'){
    AppState.mediaRecorder.pause();
    document.getElementById('rec-pause-btn').textContent = '▶ ادامه ضبط';
  } else if(AppState.mediaRecorder.state==='paused'){
    AppState.mediaRecorder.resume();
    document.getElementById('rec-pause-btn').textContent = '⏸ توقف موقت';
  }
}
function stopVoiceRecording(){
  if(!AppState.mediaRecorder) return;
  AppState.mediaRecorder.stop();
  clearTimeout(AppState.recordTimer);
  document.getElementById('rec-start-btn').style.display='inline-flex';
  document.getElementById('rec-start-btn').textContent = '🎙️ ضبط مجدد';
  document.getElementById('rec-pause-btn').style.display='none';
  document.getElementById('rec-stop-btn').style.display='none';
  document.getElementById('rec-timer').textContent = '';
}
function renderAudioPlayback(blob){
  const url = URL.createObjectURL(blob);
  document.getElementById('rec-playback').innerHTML = `
    <audio controls src="${url}" style="width:100%"></audio>
    <button class="btn btn-sm btn-danger" style="margin-top:6px" onclick="discardRecording()">حذف ضبط</button>
  `;
}
function discardRecording(){
  AppState.currentAudioBlob = 'REMOVE';
  document.getElementById('rec-playback').innerHTML = '';
}

async function saveIdea(existingId, tradeId, projectId){
  const title = document.getElementById('if-title').value.trim();
  const text = document.getElementById('if-text').value.trim();
  if(!title && !text){ toast('لطفاً عنوان یا متن ایده را وارد کنید', 'error'); return; }
  let idea = existingId ? AppState.ideas.find(i=>i.id===existingId) : null;
  const isNew = !idea;
  if(!idea) idea = {id: uid('idea'), createdAt: nowISO()};
  idea.projectId = projectId || (getActiveProject()?getActiveProject().id:null);
  idea.tradeId = tradeId || idea.tradeId || null;
  idea.title = title || text.slice(0,40);
  idea.text = text;
  idea.type = document.getElementById('if-type').value;
  idea.importance = document.getElementById('if-importance').value;
  idea.status = document.getElementById('if-status').value;
  idea.tags = document.getElementById('if-tags').value.split(',').map(s=>s.trim()).filter(Boolean);

  if(AppState.currentScreenshotBlob === 'REMOVE'){
    if(idea.screenshotId) await dbDelete('screenshots', idea.screenshotId).catch(()=>{});
    idea.screenshotId = null;
  } else if(AppState.currentScreenshotBlob instanceof Blob || (AppState.currentScreenshotBlob && AppState.currentScreenshotBlob.type)){
    const ssId = idea.screenshotId || uid('shot');
    await dbPut('screenshots', {id: ssId, blob: AppState.currentScreenshotBlob, ideaId: idea.id, createdAt: nowISO()});
    idea.screenshotId = ssId;
  }

  if(AppState.currentAudioBlob === 'REMOVE'){
    if(idea.audioId) await dbDelete('audio', idea.audioId).catch(()=>{});
    idea.audioId = null;
  } else if(AppState.currentAudioBlob instanceof Blob){
    const audId = idea.audioId || uid('aud');
    const duration = AppState.recordStart ? Math.round((Date.now()-AppState.recordStart)/1000) : null;
    await dbPut('audio', {id: audId, blob: AppState.currentAudioBlob, projectId: idea.projectId, tradeId: idea.tradeId, ideaTitle: idea.title, duration, format: AppState.currentAudioBlob.type, createdAt: nowISO()});
    idea.audioId = audId;
  }

  await dbPut('ideas', idea);
  if(isNew) AppState.ideas.push(idea);
  savedIndicator();
  closeModal();
  AppState.currentScreenshotBlob = null;
  AppState.currentAudioBlob = null;
  router();
}

async function convertIdeaToRule(ideaId){

  if(!proj){ toast('پروژه این ایده یافت نشد', 'error'); return; }
  if(!confirm(`ایده «${idea.title}» به یک قانون جدید در پروژه «${proj.name}» تبدیل شود؟`)) return;
  proj.rules = proj.rules || [];
  proj.rules.push({id: uid('rule'), text: idea.title, sourceIdeaId: idea.id});

  toast('ایده به قانون تبدیل شد', 'success');

function readGroupFilter(group, projectId){
  const f = {projectId};
  const q = document.getElementById(`ex-${group}-quality`).value; if(q) f.setupQuality = q;
  const o = document.getElementById(`ex-${group}-outcome`).value; if(o) f.outcome = o;
  const s = document.getElementById(`ex-${group}-session`).value; if(s) f.session = s;
  const sym = document.getElementById(`ex-${group}-symbol`).value; if(sym) f.symbol = sym;
  const ruleEl = document.getElementById(`ex-${group}-rule`);
  if(ruleEl && ruleEl.value){
    f.specificRuleId = ruleEl.value;
    f.specificRuleState = document.getElementById(`ex-${group}-rulestate`).value;
  }
  return f;
}

function runExperiment(projectId){
  const hypothesis = document.getElementById('ex-hypothesis').value.trim();
  const fA = readGroupFilter('A', projectId);
  const fB = readGroupFilter('B', projectId);
  const groupA = applyFilters(AppState.trades, fA);
  const groupB = applyFilters(AppState.trades, fB);
  const sA = statsForTrades(groupA), sB = statsForTrades(groupB);
  renderExperimentResult(hypothesis, sA, sB);
  AppState.lastExperiment = {hypothesis, fA, fB};
}

function renderExperimentResult(hypothesis, sA, sB){
  const minS = AppState.minSampleSize;
  const warnA = sA.n < minS, warnB = sB.n < minS;
  const diffR = sA.totalR - sB.totalR;
  const diffExp = sA.expectancy - sB.expectancy;
  const diffWR = sA.winRate - sB.winRate;

  let conclusion = '';
  if(warnA || warnB){
    conclusion = 'با توجه به تعداد نمونه محدود در یکی از گروه‌ها، نمی‌توان نتیجه‌گیری قطعی ارائه داد. برای نتیجه قابل اتکا حداقل ' + minS + ' معامله در هر گروه لازم است.';
  } else if(Math.abs(diffExp) < 0.02){
    conclusion = 'تفاوت Expectancy بین دو گروه ناچیز است؛ شواهد کافی برای برتری یک گروه نسبت به دیگری وجود ندارد.';
  } else if(diffExp > 0){
    conclusion = `گروه A از نظر Expectancy عملکرد بهتری نسبت به گروه B نشان می‌دهد (${fmtR(diffExp)} تفاوت به ازای هر معامله)، اما تعداد معاملات و شرایط بازار در تفسیر نهایی باید لحاظ شود.`;
  } else {
    conclusion = `گروه B از نظر Expectancy عملکرد بهتری نسبت به گروه A نشان می‌دهد (${fmtR(-diffExp)} تفاوت به ازای هر معامله)، اما تعداد معاملات و شرایط بازار در تفسیر نهایی باید لحاظ شود.`;
  }

  document.getElementById('experiment-result').innerHTML = `
    <div class="card">
      <div class="section-title" style="margin-top:0">نتیجه آزمایش: ${esc(hypothesis||'—')}</div>
      <div class="table-wrap"><table>
        <thead><tr><th></th><th>معاملات</th><th>Win Rate</th><th>Total R</th><th>Avg R</th><th>Expectancy</th><th>Profit Factor</th><th>Max DD</th></tr></thead>
        <tbody>
          <tr><td><b>گروه A</b>${warnA?' ⚠️':''}</td><td>${sA.n}</td><td class="${sA.winRate>=0.5?'pos':'neg'}">${fmtPct(sA.winRate)}</td><td class="${sA.totalR>=0?'pos':'neg'}">${fmtR(sA.totalR)}</td><td>${fmtR(sA.avgR)}</td><td class="${sA.expectancy>=0?'pos':'neg'}">${fmtR(sA.expectancy)}</td><td>${isFinite(sA.profitFactor)?sA.profitFactor.toFixed(2):'∞'}</td><td class="neg">${fmtR(-sA.maxDD)}</td></tr>
          <tr><td><b>گروه B</b>${warnB?' ⚠️':''}</td><td>${sB.n}</td><td class="${sB.winRate>=0.5?'pos':'neg'}">${fmtPct(sB.winRate)}</td><td class="${sB.totalR>=0?'pos':'neg'}">${fmtR(sB.totalR)}</td><td>${fmtR(sB.avgR)}</td><td class="${sB.expectancy>=0?'pos':'neg'}">${fmtR(sB.expectancy)}</td><td>${isFinite(sB.profitFactor)?sB.profitFactor.toFixed(2):'∞'}</td><td class="neg">${fmtR(-sB.maxDD)}</td></tr>
          <tr><td><b>تفاوت (A-B)</b></td><td>${sA.n-sB.n}</td><td>${fmtPct(diffWR)}</td><td>${fmtR(diffR)}</td><td>—</td><td>${fmtR(diffExp)}</td><td>—</td><td>—</td></tr>
        </tbody>
      </table></div>
      ${(warnA||warnB) ? `<div class="warn-box">⚠️ داده ناکافی در یکی از گروه‌ها (حداقل نمونه: ${minS})</div>` : ''}
      <div class="divider"></div>
      <p><b>نتیجه‌گیری:</b> ${conclusion}</p>
      <button class="btn btn-sm" style="margin-top:8px" onclick="saveCurrentExperiment('${AppState.activeProjectId}')">💾 ذخیره این آزمایش</button>
    </div>
  `;
}

  const exp = {id: uid('exp'), projectId, ...AppState.lastExperiment, createdAt: nowISO()};

function loadSavedExperiment(id){
  const exp = AppState.experiments.find(e=>e.id===id);

  const sB = statsForTrades(applyFilters(AppState.trades, exp.fB));
