name: Build TradingBoard Windows Installer
on:
  push:
    paths:
      - 'tradingboard-windows/**'
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore Python source
        shell: powershell
        run: |
          $p = Join-Path $env:GITHUB_WORKSPACE 'tradingboard-windows/app.py.gz.b64'
          $out = Join-Path $env:GITHUB_WORKSPACE 'tradingboard-windows/app.py'
          $b64 = (Get-Content -Raw $p).Trim()
          [IO.File]::WriteAllBytes($out, [Convert]::FromBase64String($b64) | % { $_ })
          python -c "import gzip; p=r'tradingboard-windows/app.py'; b=open(p,'rb').read(); open(p,'wb').write(gzip.decompress(b))"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build EXE
        shell: powershell
        run: |
          cd tradingboard-windows
          python -m pip install --upgrade pip pyinstaller
          pyinstaller --noconfirm --clean --onefile --windowed --name BacktestLab app.py
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: powershell
        run: '& "C:\\Program Files (x86)\\Inno Setup 6\\ISCC.exe" "tradingboard-windows\\installer.iss"'
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: BacktestLab-Windows-Installer
          path: tradingboard-windows/dist/BacktestLab-Setup.exe
          if-no-files-found: error
