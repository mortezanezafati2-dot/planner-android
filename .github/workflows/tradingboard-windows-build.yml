name: Build TradingBoard Windows Desktop
on:
  push:
    paths:
      - 'tradingboard-windows/**'
      - '.github/workflows/tradingboard-windows-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source
        shell: powershell
        run: python -m py_compile tradingboard-windows/app.py
      - name: Install Python packages
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r tradingboard-windows/requirements.txt
      - name: Verify original HTML source
        shell: powershell
        run: python -c "from pathlib import Path; p=Path('tradingboard-windows/TradingBoard_v12.html'); print(f'HTML source OK: {p.stat().st_size} bytes') if p.exists() else (_ for _ in ()).throw(FileNotFoundError(p))"
      - name: Build desktop app
        shell: powershell
        run: |
          cd tradingboard-windows
          pyinstaller --noconfirm --clean --onedir --windowed --name BacktestLab --add-data "TradingBoard_v12.html;tradingboard-windows" app.py
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: powershell
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "tradingboard-windows\installer.iss"'
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: BacktestLab-Windows-Installer
          path: tradingboard-windows/dist-installer/BacktestLab-Setup.exe
          if-no-files-found: error
