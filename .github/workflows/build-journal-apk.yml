name: Build Planner Journal APK
on:
  push:
    branches: [planner-journal-apk]
    paths: ['journal-planner/**', '.github/workflows/build-journal-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
        working-directory: journal-planner
      - uses: actions/upload-artifact@v4
        with:
          name: planner-journal-debug-apk
          path: journal-planner/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
