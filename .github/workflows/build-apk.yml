name: Build Aria Assistant APK

on:
  workflow_dispatch:
  push:
    branches: [ '**' ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Download Persian Vosk model
        run: |
          set -euo pipefail
          rm -rf app/src/main/assets/model-fa /tmp/vosk-fa.zip /tmp/vosk-fa
          mkdir -p app/src/main/assets
          curl -L --fail --retry 4 --retry-delay 2             -o /tmp/vosk-fa.zip             https://alphacephei.com/vosk/models/vosk-model-small-fa-0.42.zip
          mkdir -p /tmp/vosk-fa
          unzip -q /tmp/vosk-fa.zip -d /tmp/vosk-fa
          mv /tmp/vosk-fa/vosk-model-small-fa-0.42 app/src/main/assets/model-fa
          uuidgen > app/src/main/assets/model-fa/uuid

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK package, SDK, signing, and alignment
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          echo "== aapt2 badging =="
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | grep -E "package: name=|sdkVersion:|targetSdkVersion:|launchable-activity:"
          echo "== apksigner =="
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          echo "== zipalign =="
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          echo "APK structural verification passed."

      - name: Smoke test install and launch on Android 35 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            set -euo pipefail
            APK=app/build/outputs/apk/debug/app-debug.apk
            adb install "$APK"
            adb shell am start -n com.morteza.aria.v4/com.morteza.aria.MainActivity
            sleep 2
            adb shell pidof com.morteza.aria.v4
            adb shell dumpsys package com.morteza.aria.v4 | grep -E "versionCode=|versionName="
            echo "Emulator install/launch smoke test passed."

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/aria-assistant-v5.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aria-assistant-apk
          path: app/build/outputs/apk/debug/aria-assistant-v5.apk
          if-no-files-found: error
