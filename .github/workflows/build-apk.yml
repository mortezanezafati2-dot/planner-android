name: Build Bullet Journal APK

on:
  workflow_dispatch:
  push:
    branches: [ main, native-bullet-journal ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/bullet-journal.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bullet-journal-apk
          path: app/build/outputs/apk/debug/bullet-journal.apk
          if-no-files-found: error
